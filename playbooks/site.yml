---
# Provision everything from scratch (after terraform apply)
# Usage: ansible-playbook playbooks/site.yml -i inventory/hosts.yml

- name: Apply common hardening to all hosts
  hosts: all
  become: yes
  roles:
    - common

- name: Configure VPN gateway
  hosts: vpn_gw
  become: yes
  roles:
    - vpn-gateway
  vars:
    wg_private_key: "{{ vault_pm_wg_private_key }}"
    vpn_ip: "10.99.0.2"
    do_public_key: "{{ vault_do_wg_public_key }}"
    vpn_preshared_key: "{{ vault_vpn_preshared_key }}"
    do_endpoint: "192.241.155.248"
    vpn_subnet: "10.99.0.0/24"

- name: Configure web-CV server
  hosts: web_cv
  become: yes
  roles:
    - web-cv
  vars:
    site_repo: "https://github.com/Laurentcadieux/LaurentCadieuxDOTonline.git"
    site_domain: "laurentcadieux.online"
