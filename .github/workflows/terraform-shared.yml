name: Terraform — Shared (DO Edge + VPN)

on:
  push:
    branches: [main]
    paths:
      - "environments/shared/**"
      - "modules/digitalocean-edge/**"
      - "modules/proxmox-vm/**"
  pull_request:
    branches: [main]
    paths:
      - "environments/shared/**"
      - "modules/digitalocean-edge/**"
      - "modules/proxmox-vm/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-shared:
    name: Shared Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/shared

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      TF_VERSION: "1.7.0"

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.DO_TOKEN }}" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ GitHub Secrets not configured yet — skipping Terraform"
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Secrets configured"
          fi

      - name: Terraform Format
        if: steps.secrets.outputs.has_secrets == 'true'
        run: terraform fmt -check

      - name: Terraform Init
        if: steps.secrets.outputs.has_secrets == 'true'
        run: terraform init

      - name: Terraform Validate
        if: steps.secrets.outputs.has_secrets == 'true'
        run: terraform validate

      - name: Terraform Plan
        if: steps.secrets.outputs.has_secrets == 'true'
        run: |
          terraform plan \
            -var-file=dev.tfvars \
            -var="do_token=${{ secrets.DO_TOKEN }}" \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var="pm_endpoint=${{ secrets.PM_ENDPOINT }}" \
            -var="pm_api_token=${{ secrets.PM_API_TOKEN }}" \
            -var="do_wg_private_key=${{ secrets.DO_WG_PRIVATE_KEY }}" \
            -var="pm_wg_public_key=${{ secrets.PM_WG_PUBLIC_KEY }}" \
            -var="vpn_preshared_key=${{ secrets.VPN_PSK }}" \
            -no-color

      - name: Terraform Apply (main only)
        if: steps.secrets.outputs.has_secrets == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          terraform apply -auto-approve \
            -var-file=dev.tfvars \
            -var="do_token=${{ secrets.DO_TOKEN }}" \
            -var="ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var="pm_endpoint=${{ secrets.PM_ENDPOINT }}" \
            -var="pm_api_token=${{ secrets.PM_API_TOKEN }}" \
            -var="do_wg_private_key=${{ secrets.DO_WG_PRIVATE_KEY }}" \
            -var="pm_wg_public_key=${{ secrets.PM_WG_PUBLIC_KEY }}" \
            -var="vpn_preshared_key=${{ secrets.VPN_PSK }}"
